name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: k8s-ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # the split is explicit, see Cache keys
      # Cache model (owner decision 2026-11-22): a PR restores and saves; push, tag,
      # dispatch, schedule and workflow_call from main never restore (a PR job can forge
      # the cache write key), they run cold and only save. Decided here in shell, not in an if:.
      # CACHE_EPOCH is a user-level Forgejo variable; bump it to purge every cache at once.
      - name: Cache keys
        id: cachekeys
        env:
          REF: ${{ github.ref }}
          EPOCH: ${{ vars.CACHE_EPOCH || 'e1' }}
        run: |
          set -euo pipefail
          pr=false
          if [[ "$REF" == refs/pull/* ]]; then pr=true; fi
          h=$({ cat go.mod; [ ! -f go.sum ] || cat go.sum; } | sha256sum | cut -c1-16)
          {
            echo "pr=$pr"
            echo "base=${EPOCH}-go-checks-${RUNNER_OS}-${h}"
            echo "prefix=${EPOCH}-go-checks-${RUNNER_OS}-"
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        if: steps.cachekeys.outputs.pr == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cachekeys.outputs.mod }}
            ${{ steps.cachekeys.outputs.build }}
          # Never an exact hit (the run id is new): restore-keys picks the newest entry.
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.cachekeys.outputs.base }}-
            ${{ steps.cachekeys.outputs.prefix }}
      - run: go vet ./...
      # -vettool replaces vet's own analyzers, so it runs beside go vet ./..., not instead. A fresh GOCACHE: vet's cache
      # key leaves out the files the build excludes, which envban reads. errkeys is off: ukubi-go is the model, not an
      # app, and its library keys (errs.KeyInternal, connectkeys.KeyInternal, errs.From's "source.code") have no registry.
      - name: ukubicheck (dogfood)
        run: |
          go build -o "$RUNNER_TEMP/ukubicheck" ./cmd/ukubicheck
          GOCACHE="$RUNNER_TEMP/vetcache" go vet -vettool="$RUNNER_TEMP/ukubicheck" -errkeys=false ./...
      - name: go test -race
        run: |
          set -euo pipefail
          # These packages run subprocesses (go vet -vettool, a child process) over files Go's test
          # cache cannot track: -count=1 in their own invocation, same flags so the binaries are shared.
          # Every other package may come from the test cache.
          unc=(./cmd/ukubicheck ./telemetry)
          go list "${unc[@]}" > "$RUNNER_TEMP/uncached.txt"
          rest=()
          while IFS= read -r pkg; do rest+=("$pkg"); done < <(go list ./... | grep -vxFf "$RUNNER_TEMP/uncached.txt" || true)
          [ ${#rest[@]} -eq 0 ] || go test -race "${rest[@]}"
          go test -race -count=1 "${unc[@]}"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Save Go cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cachekeys.outputs.mod }}
            ${{ steps.cachekeys.outputs.build }}
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}

  buf:
    runs-on: k8s-ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # buf breaking reads the base: the PR's base branch, or main's previous commit
      # A pinned, checksum-checked binary, not bufbuild/buf-action: the action asks GitHub's API unauthenticated and
      # Forgejo runners hit its rate limit. The sha256 is the one in the release's sha256.txt.
      - name: install buf
        env:
          BUF_VERSION: 1.72.0
          BUF_SHA256: 8720830e26a733da55bb89bcd3cb44849c0965fc0c44fb5d691cccdc64dca5af
        run: |
          mkdir -p "$RUNNER_TEMP/buf"
          curl -fsSL -o "$RUNNER_TEMP/buf/buf" "https://github.com/bufbuild/buf/releases/download/v${BUF_VERSION}/buf-Linux-x86_64"
          echo "$BUF_SHA256  $RUNNER_TEMP/buf/buf" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/buf/buf"
          echo "$RUNNER_TEMP/buf" >> "$GITHUB_PATH"
      - name: buf lint
        working-directory: proto
        run: buf lint
      - name: buf breaking (against the base)
        working-directory: proto
        env:
          # A PR: its real base branch, so a stacked PR is checked against the PR under it. A push to main: where main was.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          # A missing base must fail, never read as "no proto/ on the base yet".
          git rev-parse --verify -q "$BASE^{commit}" >/dev/null || { echo "::error::base $BASE not fetched"; exit 1; }
          # A deliberate break opts out by saying so (Conventional Commits footer), visibly, and only in a commit that
          # touches proto/ (the "-- ." below): a footer about a Go API break elsewhere in the PR does not count.
          if git log --format='%B' "$BASE..HEAD" -- . | grep -q '^BREAKING CHANGE:'; then
            echo "::notice::skipping buf breaking: a commit touching proto/ declares BREAKING CHANGE:"
            exit 0
          fi
          if git cat-file -e "$BASE:proto" 2>/dev/null; then
            buf breaking --against "../.git#ref=$BASE,subdir=proto"
          else
            echo "no proto/ on $BASE yet, nothing to break against"
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # the split is explicit, see Cache keys
      # Cache model (owner decision 2026-11-22): a PR restores and saves; push, tag,
      # dispatch, schedule and workflow_call from main never restore (a PR job can forge
      # the cache write key), they run cold and only save. Decided here in shell, not in an if:.
      # CACHE_EPOCH is a user-level Forgejo variable; bump it to purge every cache at once.
      - name: Cache keys
        id: cachekeys
        env:
          REF: ${{ github.ref }}
          EPOCH: ${{ vars.CACHE_EPOCH || 'e1' }}
        run: |
          set -euo pipefail
          pr=false
          if [[ "$REF" == refs/pull/* ]]; then pr=true; fi
          h=$({ cat go.mod; [ ! -f go.sum ] || cat go.sum; } | sha256sum | cut -c1-16)
          {
            echo "pr=$pr"
            echo "base=${EPOCH}-go-buf-${RUNNER_OS}-${h}"
            echo "prefix=${EPOCH}-go-buf-${RUNNER_OS}-"
            echo "mod=$(go env GOMODCACHE)"
            echo "build=$(go env GOCACHE)"
          } >> "$GITHUB_OUTPUT"

      - name: Restore Go cache
        if: steps.cachekeys.outputs.pr == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cachekeys.outputs.mod }}
            ${{ steps.cachekeys.outputs.build }}
          # Never an exact hit (the run id is new): restore-keys picks the newest entry.
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}
          restore-keys: |
            ${{ steps.cachekeys.outputs.base }}-
            ${{ steps.cachekeys.outputs.prefix }}
      - name: buf generate
        working-directory: proto
        run: buf generate --clean
      # status, not diff: it also catches generated files that are new (untracked) or gone.
      - name: generated code is committed
        run: |
          if [ -n "$(git status --porcelain -- proto/gen)" ]; then
            echo "::error::proto/gen is out of date with proto/. Run (cd proto && buf generate --clean) and commit."
            git status --porcelain -- proto/gen
            exit 1
          fi

      - name: Save Go cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ${{ steps.cachekeys.outputs.mod }}
            ${{ steps.cachekeys.outputs.build }}
          key: ${{ steps.cachekeys.outputs.base }}-${{ github.run_id }}
